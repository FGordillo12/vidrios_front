<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Historial de cotizaciones | Vidrios Alejo</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/cotizacion.css"><style>
