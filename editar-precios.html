<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Precios | Vidrios Alejo SAS</title>
  <link rel="stylesheet" href="editarprecios.css">
  <link rel="icon" href="/img/vidrioslogo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/js/api-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="/theme.css">
</head>
<body>

  <!-- Header idéntico al de cotización -->
  <header class="cotizacion-header">
    <div class="header-content">
      <h1>
        <img src="img/vidrioslogo.png" alt="Logo Vidrios Alejo" class="header-logo">
        Editar Precios de Vidrios
      </h1>
      <p class="tipo-seleccionado" id="tipo-seleccionado"></p>
    </div>
    <a href="/index.html" class="boton-volverinicio">
      <i class="fas fa-arrow-left"></i> Volver al inicio
    </a>
  </header>

  <!-- Contenido principal -->
  <main class="cotizacion-container">
    <div class="selector-container">
      <label for="selectorTipo"><i class="fas fa-glass-whiskey"></i> Seleccione el tipo de vidrio:</label>
      <select id="selectorTipo" class="selector-tipo">
        <option value="" disabled selected>-- Seleccionar --</option>
      </select>
    </div>

    <form id="preciosForm" class="precios-form oculto"></form>

    <div class="form-actions">
      <button type="button" id="btn-guardar-precios" class="btn-guardar">
        <i class="fas fa-save"></i> Guardar Cambios
      </button>
    </div>
  </main>

  <!-- Footer igual al de cotización -->
  <footer class="cotizacion-footer">
    <div class="footer-content">
      <p>&copy; 2026 Vidrios Alejo SAS. Todos los derechos reservados.</p>
      <p><i class="fas fa-phone"></i> +57 3229340900 | <i class="fas fa-envelope"></i> contacto@vidriosalejo.com</p>
    </div>
  </footer>

  <!-- Script funcional -->
  <script src="/js/editar-precios-inline-1.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/theme.js"></script>
</body>
</html>
