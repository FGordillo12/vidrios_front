<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Restablecer Contraseña | Vidrios Alejo SAS</title>
  <link rel="stylesheet" href="/auth/auth.css">
  <link rel="icon" href="/img/vidrioslogo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    .message {
      margin-top: 1em;
      font-weight: bold;
    }
    .message.success {
      color: green;
    }
    .message.error {
      color: red;
    }
  </style>
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <div class="auth-container">
    <div class="logo-container">
      <img src="/img/vidrioslogo.png" alt="Vidrios Alejo SAS" class="auth-logo">
      <h1>Vidrios Alejo SAS</h1>
    </div>

    <h2>Restablecer Contraseña</h2>

    <form id="resetForm">
      <div class="form-group password-container">
      <label for="newPassword">Nueva Contraseña:</label>
      <div class="password-wrapper">
        <input type="password" id="newPassword" required minlength="12" autocomplete="new-password">
        <i id="togglePassword" class="toggle-password fa-solid fa-eye"></i>
      </div>
    </div>

      <button type="submit" class="btn-submit">Actualizar Contraseña</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script src="/js/api-config.js"></script>
  <script src="/auth/reset-password-inline-1.js"></script>




  <script src="/auth/reset-password-inline-2.js"></script>


<!-- Modal de carga mejorado -->
<div id="modal-reset-loading" class="loading-reset">
  <div class="modal-content">
    <div class="spinner"></div>
    <p>Actualizando nueva contraseña...</p>
  </div>
</div>


<script src="/auth/reset-password-inline-3.js"></script>




  <script src="/js/session.js"></script>
  <script src="/js/theme.js"></script>
</body>
</html>
