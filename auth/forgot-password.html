<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | Vidrios Alejo SAS</title>
  <link rel="stylesheet" href="/auth/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="/img/vidrioslogo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <div class="auth-container">
    <h2>Recuperar contraseña</h2>
    <form id="forgotPasswordForm">
      <div class="form-group">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" required>
      </div>
      <button type="submit" class="btn-submit">Enviar enlace de recuperación</button>
    </form>
    <div id="message" class="message"></div>
    <p><a href="/auth/login.html">Volver al inicio de sesión</a></p>
  </div>

  <!-- Modal de carga y resultado -->
  <div id="modal-recuperacion-loading" class="modal-recuperacion-loading">
    <div class="modal-content">
      <span id="close-modal-btn" class="close-btn">&times;</span>
      <div id="modal-spinner" class="spinner"></div>
      <p id="modal-recuperacion-message">Enviando correo de recuperación...</p>
    </div>
  </div>

  <script src="/js/api-config.js"></script>
  <script src="/auth/forgot-password-inline-1.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/theme.js"></script>
</body>
</html>
